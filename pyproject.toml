[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "slmtriage"
version = "0.1.0"
description = "Noise ceilings and evaluation artifacts in app-review intent classification"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0", "pandas>=2.2", "scikit-learn>=1.5", "scipy>=1.13",
  "torch>=2.4", "transformers>=4.45", "accelerate>=1.0", "huggingface_hub>=0.25",
  "requests>=2.31", "pyyaml>=6.0", "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]
